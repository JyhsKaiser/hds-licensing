services:
  db:
    image: postgres:15-alpine
    container_name: hds-db-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - hds_db_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    container_name: hds-api-fastify
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
    container_name: hds-web-svelte
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  hds_db_data: